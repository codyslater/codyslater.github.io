<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="broca-machina">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="717" height="177" rx="20" fill="#0e1016" stroke="#242a3a" stroke-width="2"/>

  <!-- emblem: brain-node cluster -> speech waveform -->
  <g transform="translate(44,42)">
    <g stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
      <line x1="20" y1="32" x2="33" y2="22"/>
      <line x1="20" y1="32" x2="38" y2="50"/>
      <line x1="16" y1="54" x2="38" y2="50"/>
      <line x1="33" y1="22" x2="38" y2="50"/>
      <line x1="38" y1="50" x2="28" y2="68"/>
    </g>
    <g fill="url(#g)">
      <circle cx="20" cy="32" r="4"/>
      <circle cx="33" cy="22" r="3.4"/>
      <circle cx="16" cy="54" r="3.4"/>
      <circle cx="28" cy="68" r="3"/>
      <circle cx="38" cy="50" r="6"/>
    </g>
    <line x1="44" y1="50" x2="51" y2="48" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round"/>
    <g fill="url(#g)">
      <rect x="52" y="39" width="5" height="18" rx="2.5"/>
      <rect x="61" y="29" width="5" height="38" rx="2.5"/>
      <rect x="70" y="21" width="5" height="54" rx="2.5"/>
      <rect x="79" y="33" width="5" height="30" rx="2.5"/>
      <rect x="88" y="38" width="5" height="20" rx="2.5"/>
    </g>
  </g>

  <!-- wordmark (vertically centered against the emblem) -->
  <text x="182" y="105" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="46" font-weight="700" letter-spacing="1">
    <tspan fill="#e6e9f0">broca</tspan><tspan fill="#4b5266">·</tspan><tspan fill="url(#wm)">machina</tspan>
  </text>
</svg>
