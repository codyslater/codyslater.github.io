locale:
  language: english
  # Three-letter month abbreviations throughout (RenderCV's default is "June", "July", "Sept").
  month_abbreviations: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
design:
  theme: classic
  # Compact layout. Settings only; no content is cut.
  page:
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.55in
    right_margin: 0.55in
  typography:
    line_spacing: 0.5em
    font_size:
      body: 9.5pt
      name: 26pt
      headline: 9.5pt
      connections: 9.5pt
      section_titles: 1.25em
  header:
    space_below_name: 0.3cm
    space_below_headline: 0.3cm
    space_below_connections: 0.2cm
  section_titles:
    space_above: 0.35cm
    space_below: 0.15cm
  sections:
    space_between_regular_entries: 0.5em
    space_between_text_based_entries: 0.15em
  entries:
    date_and_location_width: 3.2cm
    allow_page_break: false
  templates:
    footer: "CS -- PAGE_NUMBER/TOTAL_PAGES"
    # The link is an inline tag ([DOI], [bioRxiv]) at the end of the venue line, not its own
    # line. LINK_TAG (and DAGGER_NOTE, on papers with a † author) is added per paper by scripts/cv-link-tags.py during `npm run cv:pdf`.
    publication_entry:
      main_column: "**TITLE**\nAUTHORS\nJOURNAL LINK_TAG DAGGER_NOTE"
