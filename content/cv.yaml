# The single source of truth for Cody Slater's CV.
# Edit here only. The site's /cv/ page and the PDF both render from this file.
#   PDF:   npm run cv:pdf     (RenderCV; writes public/cv/cody-slater-cv.pdf)
#   Site:  picked up automatically by `npm run dev` / `npm run build`.
# Publication years go inside "journal" (RenderCV would render a bare year as "Jan YYYY").
# Dates are quoted strings: "YYYY-MM" or free text. A single bare year must be UNQUOTED (date: 2018); quoted "2018" renders as "Jan 2018". Use "present" for open-ended.
# Ranges with months use start_date/end_date; year-only ranges are free text "YYYY – YYYY" (en dash;
# RenderCV would invent "Jan" months from a year-only start_date/end_date).
